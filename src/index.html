<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Monetra — Pengelola Keuangan Pribadi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365C8D">
  <meta name="description" content="Kelola pemasukan, pengeluaran, dan target tabungan dengan Monetra.">
  <script>
    // Tangkap prompt install SEDIKIT MUNGKIN terlambat: Chrome hanya mengirim
    // beforeinstallprompt sekali, dan sering sebelum Angular selesai dimuat.
    window.__monetraInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__monetraInstallPrompt = e;
      window.dispatchEvent(new Event('monetra-installprompt'));
    });
    window.addEventListener('appinstalled', function () { window.__monetraInstallPrompt = null; });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) { console.warn('SW registration failed', e); });
      });
    }
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monetra">
  <meta name="application-name" content="Monetra">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
